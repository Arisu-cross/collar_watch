# CollarWatch — 手表健康上报(独立 watch app)
# 生成: xcodegen generate ; 构建脚本: run-watch-sim.sh / run-watch-device.sh
name: CollarWatch
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
targets:
  CollarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources
    dependencies:
      - target: CollarWidget
    entitlements:
      path: Sources/CollarWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Sources/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        # 直写模板,不走 INFOPLIST_KEY 注入:healthd 侧校验对注入机制有过冤案
        NSHealthShareUsageDescription: "Collar 读取心率与睡眠,同步到你自己的服务器。"
        NSHealthUpdateUsageDescription: "仅测试环境写入模拟数据。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collarwatch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Collar
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Collar 读取心率与睡眠,同步到你自己的服务器。"
        # 写权限仅模拟器塞测试数据用(DebugSeed 只编进 simulator build),缺它写库会闪退
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "仅测试环境写入模拟数据。"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  CollarWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collarwatch.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Collar
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
