# CollarWatch — 手表健康上报(独立 watch app)
# 生成: xcodegen generate ; 构建脚本: run-watch-sim.sh / run-watch-device.sh
name: CollarWatch
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
targets:
  CollarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources
    dependencies:
      - target: CollarWidget
    entitlements:
      path: Sources/CollarWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Sources/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        # 实时测量中佩戴者放下手腕屏幕熄灭,workout session 靠这个跑完
        WKBackgroundModes:
          - workout-processing
        # 直写模板,不走 INFOPLIST_KEY 注入:healthd 侧校验对注入机制有过冤案
        NSHealthShareUsageDescription: "Collar 读取心率与睡眠,同步到你自己的服务器。"
        # ⚠️ 这句必须是正经的用户向描述。HealthKit 会在运行时审查文案质量,
        # 占位敷衍文案(如旧句"仅测试环境写入模拟数据。")会在请求写权限时被判
        # invalid 直接闪退(NSInvalidArgumentException)。别写敷衍话。
        NSHealthUpdateUsageDescription: "Collar 在测量心率时需要记录体能训练会话数据。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collarwatch
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Collar
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Collar 读取心率与睡眠,同步到你自己的服务器。"
        # 与上方 info.properties 保持同句(文案质量审查见上方注释)
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Collar 在测量心率时需要记录体能训练会话数据。"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  CollarWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.collarwatch.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Collar
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
